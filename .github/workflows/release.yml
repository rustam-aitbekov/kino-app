# Every pull request merged into main: build the release APK and publish it as a GitHub Release
# (tag v1.0.<commit count>). Direct pushes to main don't release; start it by hand (workflow_dispatch) if needed.
#
# The APK must be signed with the same key as the copy installed on the TV, otherwise Android refuses to
# update it. The release build uses the debug signing config, so the owner's debug keystore is stored in
# the repo secret DEBUG_KEYSTORE_BASE64 (base64 of %USERPROFILE%\.android\debug.keystore) and restored
# to ~/.android/debug.keystore, the default path AGP reads it from.
name: Release APK

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # "closed" also fires for PRs closed without merging: skip those
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    env:
      # the commit the merge put on main, or the current commit for a manual run
      RELEASE_SHA: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0          # full history: versionCode = commit count

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::Secret DEBUG_KEYSTORE_BASE64 is missing - the APK would not install over the TV's copy."
            exit 1
          fi
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > ~/.android/debug.keystore

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --console=plain

      - name: Name the APK
        id: apk
        run: |
          count=$(git rev-list --count HEAD)
          echo "version=1.0.$count" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/release/app-release.apk "kino-1.0.$count.apk"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.apk.outputs.version }}
          name: Кино ${{ steps.apk.outputs.version }}
          target_commitish: ${{ env.RELEASE_SHA }}
          body: |
            ${{ github.event.pull_request.title || 'Manual build' }}

            ${{ github.event.pull_request.body }}

            Install on the TV: `adb install -r kino-${{ steps.apk.outputs.version }}.apk`
          files: kino-${{ steps.apk.outputs.version }}.apk
